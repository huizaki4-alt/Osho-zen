<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>是非 · Yes / No</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07060a;
  --gold:#c9a96e;
  --gold-dim:rgba(201,169,110,0.08);
  --gold-glow:rgba(201,169,110,0.15);
  --border:#211d2a;
  --border-lit:#3d3450;
  --text:#ccc0a8;
  --text-dim:#6b6050;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Serif TC",serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(138,92,192,.07) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(201,169,110,.04) 0%,transparent 60%);pointer-events:none;z-index:0}
.page{position:relative;z-index:1;width:100%;max-width:640px;min-height:100vh;margin:0 auto;padding:72px 24px 80px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.page.hidden{display:none}
.seal{width:64px;height:64px;border:1px solid rgba(201,169,110,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.main-title{font-family:"Cinzel",serif;font-size:clamp(18px,5vw,26px);letter-spacing:.35em;color:var(--gold);margin-bottom:8px;text-align:center}
.main-sub{font-size:11px;letter-spacing:.3em;color:var(--text-dim);margin-bottom:28px;text-align:center}
.ornament{display:flex;align-items:center;gap:12px;width:100%;max-width:280px;margin-bottom:32px}
.ornament-line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--border-lit))}
.ornament-line.rev{background:linear-gradient(to left,transparent,var(--border-lit))}
.ornament-symbol{color:var(--gold);font-size:8px;opacity:.7}
.q-input{width:100%;max-width:340px;background:transparent;border:none;border-bottom:1px solid rgba(201,169,110,.35);color:var(--text);font-family:inherit;font-size:16px;letter-spacing:1px;text-align:center;padding:12px 8px;margin-bottom:28px;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.q-input::placeholder{color:var(--text-dim);letter-spacing:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:"Noto Serif TC",serif;font-size:13px;letter-spacing:4px;padding:14px 44px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{background:var(--gold-glow)}
.btn-muted{border-color:var(--border-lit);color:var(--text-dim);margin-top:12px;padding:10px 28px;font-size:12px}
.home-link{display:inline-block;margin-top:22px;color:rgba(201,169,110,0.4);font-size:11px;letter-spacing:3px;text-decoration:none}
.asked{font-size:14px;letter-spacing:1px;color:var(--text-dim);text-align:center;max-width:320px;line-height:1.6;margin-bottom:18px}
.answer{font-family:"Noto Serif TC",serif;font-size:92px;line-height:1;color:var(--gold);letter-spacing:.2em;margin:8px 0 28px;text-shadow:0 0 24px rgba(201,169,110,.25)}
.answer.no{color:#c07070;text-shadow:0 0 24px rgba(192,112,112,.2)}
</style>
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="page" id="screen-ask">
  <div class="seal">
    <svg viewBox="0 0 36 36" width="36" height="36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="15" stroke="#c9a96e" stroke-width="0.6" stroke-dasharray="2 3"/>
      <circle cx="18" cy="18" r="10" stroke="#c9a96e" stroke-width="0.5" opacity="0.6"/>
      <circle cx="18" cy="18" r="1.5" fill="#c9a96e" opacity="0.7"/>
    </svg>
  </div>
  <div class="main-title">是非</div>
  <div class="main-sub">YES / NO</div>
  <div class="ornament">
    <div class="ornament-line"></div>
    <span class="ornament-symbol">◆</span>
    <div class="ornament-line rev"></div>
  </div>
  <input id="yn-q" class="q-input" type="text" maxlength="80" placeholder="想問的是非題" autocomplete="off" enterkeyhint="done">
  <button type="button" class="btn" id="yn-ask">問 卦</button>
  <a href="index.html" class="home-link">← 主頁</a>
</div>

<div class="page hidden" id="screen-result">
  <div class="main-sub">是非</div>
  <div class="asked" id="yn-result-q"></div>
  <div class="answer" id="yn-answer" data-answer=""></div>
  <button type="button" class="btn" id="yn-again">再 問 一 次</button>
  <button type="button" class="btn btn-muted" id="yn-back">返 回</button>
</div>

<script src="./history.js"></script>
<script>
(function () {
  var busy = false;

  function showAnswer(q, answer) {
    var el = document.getElementById('yn-answer');
    el.textContent = answer;
    el.dataset.answer = answer;
    el.classList.toggle('no', answer === '否');
    document.getElementById('yn-result-q').textContent = q || '靜心一問';
    document.getElementById('screen-ask').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');
  }

  function showAsk() {
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-ask').classList.remove('hidden');
  }

  function ask() {
    if (busy) return;
    busy = true;
    var q = document.getElementById('yn-q').value.trim();
    var answer = Math.random() < 0.5 ? '是' : '否';
    setTimeout(function () {
      busy = false;
      showAnswer(q, answer);
      DivinationHistory.save('yes-no', {
        id: DivinationHistory.uid('yes'),
        page: 'yes-no',
        mode: 'yes-no',
        modeLabel: '是非',
        question: q,
        summary: answer,
        answer: answer
      });
    }, 280);
  }

  function reopenYesNo(rec) {
    showAnswer(rec.question || '', rec.answer === '否' ? '否' : '是');
  }

  document.getElementById('yn-ask').addEventListener('click', ask);
  document.getElementById('yn-q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') ask();
  });
  document.getElementById('yn-again').addEventListener('click', showAsk);
  document.getElementById('yn-back').addEventListener('click', showAsk);
  DivinationHistory.attach({ page: 'yes-no', reopen: reopenYesNo });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
})();
</script>
</body>
</html>
