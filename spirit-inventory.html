<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spirit Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07060a;
  --gold:#c9a96e;
  --gold-dim:rgba(201,169,110,0.06);
  --gold-glow:rgba(201,169,110,0.12);
  --border:#211d2a;
  --border-lit:#3d3450;
  --text:#ccc0a8;
  --text-dim:#6b6050;
  --ordered:#c9a96e;
  --ordered-bg:rgba(201,169,110,0.08);
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Serif TC",serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(138,92,192,.05) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(201,169,110,.03) 0%,transparent 60%);pointer-events:none;z-index:0}

.page{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;padding:48px 24px 80px}

.header{text-align:center;margin-bottom:48px}
.header-title{font-family:"Cinzel",serif;font-size:clamp(16px,4vw,22px);letter-spacing:.35em;color:var(--gold);margin-bottom:6px}
.header-sub{font-size:11px;letter-spacing:.3em;color:var(--text-dim)}

.ornament{display:flex;align-items:center;gap:12px;margin:24px 0}
.ornament-line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--border-lit))}
.ornament-line.rev{background:linear-gradient(to left,transparent,var(--border-lit))}
.ornament-symbol{color:var(--gold);font-size:8px;opacity:.6}

.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;justify-content:center}
.filter-btn{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.2em;color:var(--text-dim);border:1px solid var(--border);background:transparent;padding:6px 14px;cursor:pointer;border-radius:2px;transition:all .2s;-webkit-tap-highlight-color:transparent}
.filter-btn:hover,.filter-btn.active{color:var(--gold);border-color:var(--border-lit);background:var(--gold-dim)}

.category{margin-bottom:40px}
.category-header{font-family:"Cinzel",serif;font-size:10px;letter-spacing:.4em;color:var(--gold);margin-bottom:12px;opacity:.8;text-transform:uppercase}

.item{display:grid;grid-template-columns:32px 90px 1fr 28px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);transition:background .2s}
.item:first-of-type{border-top:1px solid var(--border)}
.item.ordered{background:var(--ordered-bg)}
.item.hidden{display:none}

.item-qty{font-family:"Cinzel",serif;font-size:13px;color:var(--gold);text-align:center;opacity:.9}
.item-qty.zero{opacity:0}
.item-sku{font-size:10px;color:var(--text-dim);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.item-name{font-size:12px;letter-spacing:.05em;line-height:1.4}
.item-name.ordered-name{color:var(--text)}
.item-name.unordered-name{color:var(--text-dim)}
.item-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.6;justify-self:center}
.item-dot.hidden-dot{opacity:0}

.legend{display:flex;gap:24px;justify-content:center;margin-bottom:28px;font-size:10px;letter-spacing:.15em;color:var(--text-dim)}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-dot{width:6px;height:6px;border-radius:50%}
.legend-dot.ord{background:var(--gold)}
.legend-dot.unord{background:var(--border-lit)}

.summary{text-align:center;margin-top:40px;font-size:10px;letter-spacing:.2em;color:var(--text-dim)}

@media(max-width:480px){
  .item{grid-template-columns:28px 76px 1fr 20px}
  .item-sku{font-size:9px}
  .item-name{font-size:11px}
}
</style>
</head>
<body>

    <div class="header-title">SPIRIT INVENTORY</div>

  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot ord"></div>已訂</div>
    <div class="legend-item"><div class="legend-dot unord"></div>未訂</div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">ALL</button>
    <button class="filter-btn" data-filter="ordered">ORDERED</button>
    <button class="filter-btn" data-filter="Spirit">SPIRIT</button>

  <div id="inventory"></div>

  <div class="ornament"><div class="ornament-line"></div><span class="ornament-symbol">◆</span><div class="ornament-line rev"></div></div>
  <div class="summary" id="summary"></div>

const categories = [...new Set(data.map(d=>d.cat))];
let currentFilter = 'all';

function render(filter) {
  const inv = document.getElementById('inventory');
  inv.innerHTML = '';

  let totalOrdered = 0, totalItems = 0;

  categories.forEach(cat => {
    const items = data.filter(d => d.cat === cat);
    const visibleItems = items.filter(d => {
      if (filter === 'ordered') return d.qty > 0;
      if (filter === 'all') return true;
      if (filter === cat) return true;
      return false;
    });
    if (visibleItems.length === 0) return;

    const section = document.createElement('div');
    section.className = 'category';

    const hdr = document.createElement('div');
    hdr.className = 'category-header';
    hdr.textContent = cat.toUpperCase();
    section.appendChild(hdr);

    visibleItems.forEach(d => {
      const row = document.createElement('div');
      row.className = 'item' + (d.qty > 0 ? ' ordered' : '');

      const qty = document.createElement('div');
      qty.className = 'item-qty' + (d.qty === 0 ? ' zero' : '');
      qty.textContent = d.qty || '·';

      const sku = document.createElement('div');
      sku.className = 'item-sku';
      sku.textContent = d.sku || '—';

      const name = document.createElement('div');
      name.className = 'item-name ' + (d.qty > 0 ? 'ordered-name' : 'unordered-name');
      name.textContent = d.name;

      const dot = document.createElement('div');
      dot.className = 'item-dot' + (d.qty === 0 ? ' hidden-dot' : '');

      row.append(qty, sku, name, dot);
      section.appendChild(row);

      if (d.qty > 0) totalOrdered++;
      totalItems++;
    });

    inv.appendChild(section);
  });

  document.getElementById('summary').textContent =
    `${totalOrdered} ordered · ${totalItems} total`;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render(currentFilter);
  });
});

render('all');
</script>
