<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占星骰 · Astro Dice</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#04060c; --gold:#c9a84c; --gold-light:#f0d98a;
    --silver:#b8c0cc; --silver-dim:#3e4554; --white:#f0ece4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--white);
    font-family:'Cormorant Garamond',serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; overflow:hidden;
  }
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .star{
    position:absolute;border-radius:50%;background:white;
    animation:twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:var(--a);}to{opacity:var(--b);}}

  .container{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    padding:2rem 1rem;width:100%;max-width:560px;
  }

  .header{text-align:center;margin-bottom:2.5rem;animation:fadeDown 1.2s ease both;}
  .title-en{
    font-family:'Cinzel',serif;font-size:clamp(0.65rem,2.2vw,0.85rem);
    letter-spacing:0.45em;color:var(--gold);text-transform:uppercase;margin-bottom:0.4rem;
  }
  .title-zh{font-size:clamp(2rem,7vw,2.8rem);font-weight:300;letter-spacing:0.22em;line-height:1;}
  .divider{width:80px;height:1px;margin:1rem auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);}

  .dice-row{
    display:flex;gap:clamp(0.8rem,3.5vw,2rem);
    align-items:center;justify-content:center;
    margin-bottom:2.4rem;animation:fadeUp 1.2s 0.3s ease both;
  }
  .die-wrapper{display:flex;flex-direction:column;align-items:center;gap:0.65rem;}
  .die-label{
    font-family:'Cinzel',serif;font-size:0.56rem;
    letter-spacing:0.24em;color:var(--silver-dim);text-transform:uppercase;
  }

  /* Die — purely SVG-based, no HTML clip-path issues */
  .die{
    position:relative;
    width:clamp(104px,25vw,132px);
    height:clamp(104px,25vw,132px);
  }
  .die-svg{width:100%;height:100%;overflow:visible;display:block;}

  /* Number overlay for house die */
  .die-number{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;
    font-size:clamp(1.9rem,6.5vw,2.5rem);
    font-weight:600;color:var(--gold-light);
    text-shadow:0 0 10px rgba(240,215,120,1),0 0 25px rgba(240,180,60,0.7),0 0 50px rgba(200,140,20,0.4);
    user-select:none;transition:opacity 0.12s;
    pointer-events:none;
  }
  /* Symbol overlay for planets & fallback signs */
  .die-symbol{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(1.5rem,5vw,2rem);
    color:var(--gold-light);
    text-shadow:0 0 8px rgba(240,215,120,0.9),0 0 20px rgba(240,180,60,0.6),0 0 40px rgba(200,140,20,0.3);
    user-select:none;pointer-events:none;transition:opacity 0.12s;
    font-family:'Segoe UI Symbol','Apple Symbols','Symbola',serif;
    font-variant-emoji:text;
  }
  .r-sym{
    font-size:1.3rem;color:var(--silver);
    font-family:'Segoe UI Symbol','Apple Symbols','Symbola',serif;
    line-height:1;font-variant-emoji:text;
  }

  /* Rolled state */
  .die.rolled .die-number{
    color:#fffae8;
    text-shadow:0 0 14px rgba(255,250,200,1),0 0 35px rgba(255,200,60,0.8),0 0 60px rgba(255,180,40,0.5);
  }
  .die.rolled .die-symbol{
    color:#fffae8;
    text-shadow:0 0 10px rgba(255,250,200,1),0 0 28px rgba(255,200,60,0.8),0 0 55px rgba(255,180,40,0.5);
  }

  @keyframes dieRoll{
    0%{transform:rotate(0deg) scale(1);}
    20%{transform:rotate(-9deg) scale(0.93);}
    45%{transform:rotate(6deg) scale(1.04);}
    70%{transform:rotate(-3deg) scale(0.98);}
    100%{transform:rotate(0deg) scale(1);}
  }
  @keyframes symFlash{
    0%,100%{opacity:1;}
    40%,60%{opacity:0;}
  }
  .die.rolling{animation:dieRoll 0.65s cubic-bezier(0.36,0.07,0.19,0.97) both;}
  .die.rolling .die-number,
  .die.rolling .die-symbol{animation:symFlash 0.65s ease both;}

  .cast-btn{
    background:transparent;border:1px solid var(--gold);
    color:var(--gold);font-family:'Cinzel',serif;
    font-size:clamp(0.65rem,2vw,0.78rem);letter-spacing:0.3em;
    text-transform:uppercase;padding:0.9rem 2.5rem;
    cursor:pointer;transition:border-color 0.2s, color 0.2s, box-shadow 0.2s;
    position:relative;overflow:hidden;
    animation:fadeUp 1.2s 0.5s ease both;margin-bottom:2rem;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .cast-btn::before{
    content:'';position:absolute;inset:0;
    background:rgba(201,168,76,0.08);opacity:0;transition:opacity 0.2s;
  }
  .cast-btn:hover::before,.cast-btn.pressing::before{opacity:1;}
  .cast-btn:hover,.cast-btn.pressing{
    border-color:var(--gold-light);color:var(--gold-light);
    box-shadow:0 0 25px rgba(201,168,76,0.18);
  }
  .cast-btn:disabled{opacity:0.35;cursor:not-allowed;}

  /* Press progress ring */
  .btn-ring{
    position:absolute;inset:-3px;border-radius:0;
    pointer-events:none;
  }

  /* Spinning dice during hold */
  @keyframes spinHold{
    0%{transform:rotate(0deg) scale(1);}
    25%{transform:rotate(-8deg) scale(0.95);}
    50%{transform:rotate(5deg) scale(1.03);}
    75%{transform:rotate(-3deg) scale(0.98);}
    100%{transform:rotate(0deg) scale(1);}
  }
  .die.holding{animation:spinHold 0.4s ease-in-out infinite;}
  .die.holding .die-number,
  .die.holding .die-symbol{animation:symFlash 0.3s ease infinite;}

  .result-strip{
    display:flex;align-items:center;gap:0.8rem;
    opacity:0;transition:opacity 0.8s 0.35s;min-height:40px;
  }
  .result-strip.visible{opacity:1;}
  .r-num{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--silver);font-weight:600;}
  .r-sign-svg{width:34px;height:34px;}

  .r-dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:0.5;}
  .r-name{font-size:0.75rem;color:var(--silver-dim);letter-spacing:0.08em;font-style:italic;}

  @keyframes fadeDown{from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- SVG defs: clip path + glow filter -->
<svg width="0" height="0" style="position:absolute;overflow:hidden">
  <defs>
    <clipPath id="deca-clip" clipPathUnits="objectBoundingBox">
      <polygon points="0.5,0.02 0.79,0.11 0.98,0.35 0.98,0.65 0.79,0.89 0.5,0.98 0.21,0.89 0.02,0.65 0.02,0.35 0.21,0.11"/>
    </clipPath>
    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<div class="container">
  <div class="header">
    <div class="title-en">Astro Dice Oracle</div>
    <div class="title-zh">占星骰</div>
    <div class="divider"></div>
  </div>

  <div class="dice-row">

    <!-- Die 1: House -->
    <div class="die-wrapper">
      <div class="die-label">宮位</div>
      <div class="die" id="die1">
        <svg class="die-svg" viewBox="0 0 100 100">
          <defs>
            <clipPath id="clip1">
              <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"/>
            </clipPath>
            <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#1a1c22"/>
              <stop offset="100%" stop-color="#07090f"/>
            </radialGradient>
            <radialGradient id="glow-grad1" cx="50%" cy="50%" r="45%">
              <stop offset="0%" stop-color="rgba(240,200,80,0.22)"/>
              <stop offset="100%" stop-color="rgba(240,200,80,0)"/>
            </radialGradient>
          </defs>
          <!-- Background -->
          <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="url(#bg-grad)" clip-path="url(#clip1)"/>
          <!-- Glow (visible when rolled) -->
          <polygon id="glow1" points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="url(#glow-grad1)" clip-path="url(#clip1)" opacity="0" style="transition:opacity 0.4s"/>
          <!-- Border -->
          <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="none" stroke="rgba(180,155,85,0.55)" stroke-width="1"/>
          <polygon points="50,8 76,16 93,38 93,62 76,84 50,92 24,84 7,62 7,38 24,16"
            fill="none" stroke="rgba(180,155,85,0.12)" stroke-width="0.6"/>
        </svg>
        <div class="die-number" id="num1">·</div>
      </div>
    </div>

    <!-- Die 2: Zodiac -->
    <div class="die-wrapper">
      <div class="die-label">星座</div>
      <div class="die" id="die2">
        <svg class="die-svg" viewBox="0 0 100 100" id="svgDie2">
          <defs>
            <clipPath id="clip2">
              <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"/>
            </clipPath>
            <radialGradient id="bg-grad2" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#1a1c22"/>
              <stop offset="100%" stop-color="#07090f"/>
            </radialGradient>
            <radialGradient id="glow-grad2" cx="50%" cy="50%" r="45%">
              <stop offset="0%" stop-color="rgba(240,200,80,0.25)"/>
              <stop offset="100%" stop-color="rgba(240,200,80,0)"/>
            </radialGradient>
            <!-- Dark overlay gradient to kill photo background -->
            <radialGradient id="dark-overlay" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0.82)"/>
            </radialGradient>
          </defs>
          <!-- Black base -->
          <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="url(#bg-grad2)" clip-path="url(#clip2)"/>
          <!-- Sign image -->
          <image id="signImg" href="" x="0" y="0" width="100" height="100"
            clip-path="url(#clip2)" preserveAspectRatio="xMidYMid slice"
            style="display:none; mix-blend-mode:lighten; opacity:0.75"/>
          <!-- Dark vignette to kill photo bg, keep glowing symbol -->
          <polygon id="darkOverlay2" points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="url(#dark-overlay)" clip-path="url(#clip2)" style="display:none"/>
          <polygon id="glow2" points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="url(#glow-grad2)" clip-path="url(#clip2)" opacity="0" style="transition:opacity 0.4s"/>
          <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="none" stroke="rgba(180,155,85,0.55)" stroke-width="1"/>
          <polygon points="50,8 76,16 93,38 93,62 76,84 50,92 24,84 7,62 7,38 24,16"
            fill="none" stroke="rgba(180,155,85,0.12)" stroke-width="0.6"/>
        </svg>
        <div class="die-symbol" id="sym2" style="display:none"></div>
      </div>
    </div>

    <!-- Die 3: Planet -->
    <div class="die-wrapper">
      <div class="die-label">星體</div>
      <div class="die" id="die3">
        <svg class="die-svg" viewBox="0 0 100 100">
          <defs>
            <clipPath id="clip3">
              <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"/>
            </clipPath>
            <radialGradient id="bg-grad3" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#1a1c22"/>
              <stop offset="100%" stop-color="#07090f"/>
            </radialGradient>
            <radialGradient id="glow-grad3" cx="50%" cy="50%" r="45%">
              <stop offset="0%" stop-color="rgba(240,200,80,0.22)"/>
              <stop offset="100%" stop-color="rgba(240,200,80,0)"/>
            </radialGradient>
          </defs>
          <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="url(#bg-grad3)" clip-path="url(#clip3)"/>
          <polygon id="glow3" points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="url(#glow-grad3)" clip-path="url(#clip3)" opacity="0" style="transition:opacity 0.4s"/>
          <polygon points="50,2 79,11 98,35 98,65 79,89 50,98 21,89 2,65 2,35 21,11"
            fill="none" stroke="rgba(180,155,85,0.55)" stroke-width="1"/>
          <polygon points="50,8 76,16 93,38 93,62 76,84 50,92 24,84 7,62 7,38 24,16"
            fill="none" stroke="rgba(180,155,85,0.12)" stroke-width="0.6"/>
        </svg>
        <div class="die-symbol" id="sym3"></div>
      </div>
    </div>

  </div>

  <button class="cast-btn" id="castBtn">✦ &nbsp;按住擲骰&nbsp; ✦</button>

  <div class="result-strip" id="resultStrip">
    <div class="r-num" id="r1"></div>
    <div class="r-dot"></div>
    <div id="r2"></div>
    <div class="r-dot"></div>
    <div class="r-sym" id="r3"></div>
    <div class="r-name" id="rname"></div>
  </div>
</div>

    const a=(Math.random()*0.15+0.04).toFixed(2);
    const b=(parseFloat(a)+Math.random()*0.35+0.06).toFixed(2);
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;
      width:${sz}px;height:${sz}px;
      --d:${(Math.random()*4+2).toFixed(1)}s;--a:${a};--b:${b};`;
    c.appendChild(s);
  }
})();


// ── State ─────────────────────────────────────────────
let holding    = false;  // 用家正在按住
let shuffleTmr = null;   // 洗牌 interval
let shuffleSpd = 120;    // 初始洗牌速度 (ms)，會隨時間加快

// ── Helpers ───────────────────────────────────────────
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function applySign(sign){
  const img=document.getElementById('signImg');
  const sym=document.getElementById('sym2');
  const overlay=document.getElementById('darkOverlay2');
  const src=SIGN_IMGS[sign.key];
  if(src){
    img.setAttribute('href',src);
    img.style.display='';
    overlay.style.display='';
    sym.style.display='none';
  } else {
    img.style.display='none';
    overlay.style.display='none';
    sym.style.display='flex';
    sym.textContent=SIGN_SYM[sign.key];
  }
}

function applyPlanet(planet){
  document.getElementById('sym3').textContent=PLANET_SYM[planet.key];
}

function setRolled(on){
  ['glow1','glow2','glow3'].forEach(id=>{
    document.getElementById(id).setAttribute('opacity',on?'1':'0');
  });
  ['die1','die2','die3'].forEach(id=>{
    document.getElementById(id).classList.toggle('rolled',on);
  });
}

function shuffle(){
  document.getElementById('num1').textContent=pick(HOUSES);
  applySign(pick(SIGNS));
  applyPlanet(pick(PLANETS));
}

function startHolding(){
  if(holding) return;
  holding = true;
  shuffleSpd = 120;

  const btn = document.getElementById('castBtn');
  btn.classList.add('pressing');
  btn.textContent='';
  btn.appendChild(Object.assign(document.createElement('span'),{textContent:'✦  擲骰中  ✦'}));

  // clear previous result glow
  setRolled(false);
  document.getElementById('resultStrip').classList.remove('visible');

  // start holding spin on dice
  ['die1','die2','die3'].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.remove('rolled','rolling');
    el.classList.add('holding');
  });

  // immediate first shuffle
  shuffle();

  // adaptive speed: starts slow, speeds up the longer you hold
  function scheduleShuffle(){
    if(!holding) return;
    shuffle();
    // speed up over time, cap at 40ms
    shuffleSpd = Math.max(40, shuffleSpd * 0.92);
    shuffleTmr = setTimeout(scheduleShuffle, shuffleSpd);
  }
  shuffleTmr = setTimeout(scheduleShuffle, shuffleSpd);
}

function stopHolding(){
  if(!holding) return;
  holding = false;
  clearTimeout(shuffleTmr);

  const btn = document.getElementById('castBtn');
  btn.classList.remove('pressing');
  btn.innerHTML = '✦ &nbsp;按住擲骰&nbsp; ✦';

  // stop holding, do one final random pick
  const house  = pick(HOUSES);
  const sign   = pick(SIGNS);
  const planet = pick(PLANETS);

  // brief settle animation
  ['die1','die2','die3'].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.remove('holding');
    void el.offsetWidth;
    el.classList.add('rolling');
    el.addEventListener('animationend',()=>el.classList.remove('rolling'),{once:true});
  });

  // apply final values after brief delay
  setTimeout(()=>{
    document.getElementById('num1').textContent=house;
    applySign(sign);
    applyPlanet(planet);
    setRolled(true);

    // result strip
    document.getElementById('r1').textContent=house;
    const r2=document.getElementById('r2');
    const src=SIGN_IMGS[sign.key];
    if(src){
      r2.innerHTML=`<svg class="r-sign-svg" viewBox="0 0 100 100"><defs><clipPath id="rclip"><circle cx="50" cy="50" r="50"/></clipPath></defs><image href="${src}" x="0" y="0" width="100" height="100" clip-path="url(#rclip)" preserveAspectRatio="xMidYMid slice"/></svg>`;
    } else {
      r2.innerHTML=`<span class="r-sym">${SIGN_SYM[sign.key]}</span>`;
    }
    document.getElementById('r3').textContent=PLANET_SYM[planet.key];
    document.getElementById('rname').textContent=`${sign.name}・${planet.name}`;
    document.getElementById('resultStrip').classList.add('visible');
  }, 350);
}

// ── Bind events ───────────────────────────────────────
(function bindBtn(){
  const btn = document.getElementById('castBtn');

  // Mouse
  btn.addEventListener('mousedown', e=>{ e.preventDefault(); startHolding(); });
  window.addEventListener('mouseup', ()=>{ if(holding) stopHolding(); });

  // Touch (mobile)
  btn.addEventListener('touchstart', e=>{ e.preventDefault(); startHolding(); }, {passive:false});
  window.addEventListener('touchend',  ()=>{ if(holding) stopHolding(); });
  window.addEventListener('touchcancel',()=>{ if(holding) stopHolding(); });
})();</script>
