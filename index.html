<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占卜工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07060a;
  --gold:#c9a96e;
  --gold-dim:rgba(201,169,110,0.08);
  --gold-glow:rgba(201,169,110,0.15);
  --border:#211d2a;
  --border-lit:#3d3450;
  --text:#ccc0a8;
  --text-dim:#6b6050;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Noto Serif TC",serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(138,92,192,.07) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(201,169,110,.04) 0%,transparent 60%);pointer-events:none;z-index:0}

.page{position:relative;z-index:1;width:100%;max-width:640px;min-height:100vh;margin:0 auto;padding:64px 24px 80px;display:flex;flex-direction:column;align-items:center;justify-content:center}

.seal{width:64px;height:64px;border:1px solid rgba(201,169,110,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:32px}
.seal svg{width:36px;height:36px;opacity:.6}

.main-title{font-family:"Cinzel",serif;font-size:clamp(18px,5vw,26px);letter-spacing:.35em;color:var(--gold);margin-bottom:8px;text-align:center}
.main-sub{font-size:11px;letter-spacing:.3em;color:var(--text-dim);margin-bottom:40px;text-align:center}

.ornament{display:flex;align-items:center;gap:12px;width:100%;max-width:280px;margin-bottom:48px}
.ornament-line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--border-lit))}
.ornament-line.rev{background:linear-gradient(to left,transparent,var(--border-lit))}
.ornament-symbol{color:var(--gold);font-size:8px;opacity:.7}

.tools{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px}

.tool-card{display:block;text-decoration:none;padding:28px 32px;border:1px solid var(--border);border-radius:4px;background:var(--gold-dim);position:relative;overflow:hidden;transition:border-color .3s,background .3s;-webkit-tap-highlight-color:transparent}
.tool-card::before{content:"";position:absolute;inset:0;background:var(--gold-glow);opacity:0;transition:opacity .3s;pointer-events:none}
.tool-card:hover{border-color:var(--border-lit)}
.tool-card:hover::before{opacity:1}
.tool-card:active::before{opacity:1.5}

.tool-title{font-family:"Cinzel",serif;font-size:15px;letter-spacing:.25em;color:var(--gold);margin-bottom:6px}
.tool-sub{font-size:11px;letter-spacing:.2em;color:var(--text-dim)}

.tool-card .tool-arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:rgba(201,169,110,0.3);font-size:14px;transition:color .3s,transform .3s}
.tool-card:hover .tool-arrow{color:rgba(201,169,110,0.7);transform:translateY(-50%) translateX(3px)}
</style>
</head>
<body>
<div class="page">
  <div class="seal">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="18" cy="18" r="15" stroke="#c9a96e" stroke-width="0.6" stroke-dasharray="2 3"/>
      <circle cx="18" cy="18" r="10" stroke="#c9a96e" stroke-width="0.5" opacity="0.6"/>
      <circle cx="18" cy="18" r="5" stroke="#c9a96e" stroke-width="0.5" opacity="0.5"/>
      <circle cx="18" cy="18" r="1.5" fill="#c9a96e" opacity="0.7"/>
    </svg>
  </div>

  <div class="ornament">
    <div class="ornament-line"></div>
    <span class="ornament-symbol">◆</span>
    <div class="ornament-line rev"></div>
  </div>

  <div class="tools">
    <a href="osho-zen.html" class="tool-card">
      <div class="tool-title">OSHO ZEN</div>
      <div class="tool-sub">禪卡占卜</div>
      <span class="tool-arrow">›</span>
    </a>
    <a href="iching.html" class="tool-card">
      <div class="tool-title">易經塔羅</div>
      <div class="tool-sub">六十四卦</div>
      <span class="tool-arrow">›</span>
    </a>
    <a href="astro-dice.html" class="tool-card">
      <div class="tool-title">占星骰</div>
      <div class="tool-sub">Astro Dice</div>
      <span class="tool-arrow">›</span>
    </a>
  </div>
</div>
</body>
</html>
